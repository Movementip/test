name: Build Lane IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LaneIOSPrototype/**"
      - "LaneIOSPrototype.xcodeproj/**"
      - "LaneAssets/**"
      - "Tools/LaneContractTests.swift"
      - "LaneIOSPrototypeUITests/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: iPhone 13 navigation and persistence regression tests
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(x["identifier"] for x in reversed(json.load(sys.stdin)["runtimes"]) if x.get("isAvailable") and "iOS" in x["name"]))')
          UDID=$(xcrun simctl create "Lane iPhone 13" com.apple.CoreSimulator.SimDeviceType.iPhone-13 "$RUNTIME")
          mkdir -p Output
          xcodebuild -project LaneIOSPrototype.xcodeproj -scheme LaneIOSPrototype \
            -configuration Debug -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath /tmp/lane-simulator-build \
            -resultBundlePath Output/Lane-Simulator.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lane-iPhone13-Test-Results
          path: Output/Lane-Simulator.xcresult

  build:
    needs: simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: API contract tests
        run: |
          swiftc -parse-as-library -swift-version 5 \
            LaneIOSPrototype/LaneModels.swift \
            LaneIOSPrototype/RequestSigner.swift \
            LaneIOSPrototype/LaneAPI.swift \
            Tools/LaneContractTests.swift \
            -o /tmp/lane-contract-tests -lz
          /tmp/lane-contract-tests

      - name: Build unsigned app
        run: |
          set -euo pipefail
          rm -rf build Payload Output
          xcodebuild             -project LaneIOSPrototype.xcodeproj             -scheme LaneIOSPrototype             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"

          mkdir -p Payload Output
          cp -R "$APP_PATH" Payload/Lane.app

          # Original Lane artwork extracted from lane1.4.7.apk.
          if [ -d LaneAssets ]; then
            cp LaneAssets/*.png Payload/Lane.app/ 2>/dev/null || true
          fi

          # Generate standard iPhone icon sizes from the original Lane splash mark.
          if [ -f LaneAssets/ic_splash_logo_dark.png ]; then
            sips -z 120 120 LaneAssets/ic_splash_logo_dark.png --out Payload/Lane.app/Icon-60@2x.png >/dev/null
            sips -z 180 180 LaneAssets/ic_splash_logo_dark.png --out Payload/Lane.app/Icon-60@3x.png >/dev/null
          fi

          ditto -c -k --sequesterRsrc --keepParent Payload Output/Lane.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lane-IPA
          path: Output/Lane.ipa
          if-no-files-found: error
