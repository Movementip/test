name: Build Lane IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LaneIOSPrototype/**"
      - "LaneIOSPrototype.xcodeproj/**"
      - "LaneAssets/**"
      - "Tools/LaneContractTests.swift"
      - "LaneIOSPrototypeUITests/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: iPhone 13 navigation and persistence regression tests
        run: |
          set -euo pipefail
          LANE_SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME=$(xcrun simctl list runtimes -j | python3 Tools/select_simulator_runtime.py "$LANE_SIMULATOR_SDK")
          echo "Testing Xcode SDK $LANE_SIMULATOR_SDK with runtime $RUNTIME"
          UDID=$(xcrun simctl create "Lane iPhone 13" com.apple.CoreSimulator.SimDeviceType.iPhone-13 "$RUNTIME")
          mkdir -p Output
          xcodebuild -project LaneIOSPrototype.xcodeproj -scheme LaneIOSPrototype \
            -configuration Debug -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath /tmp/lane-simulator-build \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" build-for-testing

          # Fail before booting/running the suite if Xcode drops or rewrites
          # original APK artwork. Android PNGs must bypass pngcrush entirely.
          APP_BUNDLE=/tmp/lane-simulator-build/Build/Products/Debug-iphonesimulator/LaneIOSPrototype.app
          for asset in LaneAssets/*.png LaneAssets/amen.gif; do
            cmp "$asset" "$APP_BUNDLE/${asset##*/}"
          done
          for font in LaneAssets/Fonts/*; do
            cmp "$font" "$APP_BUNDLE/Fonts/${font##*/}"
          done
          swift -e 'import Foundation; import ImageIO; for url in try FileManager.default.contentsOfDirectory(at: URL(fileURLWithPath: "LaneAssets"), includingPropertiesForKeys: nil).filter({ $0.pathExtension == "png" }) { guard let source = CGImageSourceCreateWithURL(url as CFURL, nil), CGImageSourceCreateImageAtIndex(source, 0, nil) != nil else { fatalError("Undecodable APK artwork: \(url.lastPathComponent)") } }'

          # Wait for the first simulator boot (SpringBoard/accessibility), not
          # just process creation. Never retry a failed application assertion.
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          xcodebuild -project LaneIOSPrototype.xcodeproj -scheme LaneIOSPrototype \
            -configuration Debug -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath /tmp/lane-simulator-build \
            -resultBundlePath Output/Lane-Simulator.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" test-without-building
      - name: Export simulator screenshots and diagnostics
        if: always()
        run: |
          if [ -d Output/Lane-Simulator.xcresult ]; then
            xcrun xcresulttool export attachments --path Output/Lane-Simulator.xcresult --output-path Output/Attachments
            xcrun xcresulttool get test-results summary --path Output/Lane-Simulator.xcresult > Output/Test-Summary.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lane-iPhone13-Test-Results
          path: Output/

  build:
    needs: simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: API contract tests
        run: |
          swiftc -parse-as-library -swift-version 5 \
            LaneIOSPrototype/LaneModels.swift \
            LaneIOSPrototype/RequestSigner.swift \
            LaneIOSPrototype/LaneAPI.swift \
            Tools/LaneContractTests.swift \
            -o /tmp/lane-contract-tests -lz
          /tmp/lane-contract-tests

      - name: Equalizer PCM tests
        run: |
          swiftc -parse-as-library -swift-version 5 LaneIOSPrototype/LaneEqualizer.swift Tools/LaneEqualizerTests.swift -o /tmp/lane-equalizer-tests
          /tmp/lane-equalizer-tests

      - name: Native HLS offline persistence tests
        run: |
          swiftc -parse-as-library -swift-version 5 -DLANE_HLS_NATIVE_TEST \
            LaneIOSPrototype/LaneModels.swift LaneIOSPrototype/RequestSigner.swift \
            LaneIOSPrototype/LaneAPI.swift LaneIOSPrototype/LaneHLSOfflineStore.swift \
            Tools/LaneContractTests.swift Tools/LaneHLSOfflineTests.swift \
            -o /tmp/lane-native-hls-tests -lz
          /tmp/lane-native-hls-tests

      - name: Build unsigned app
        run: |
          set -euo pipefail
          rm -rf build Payload Output
          xcodebuild             -project LaneIOSPrototype.xcodeproj             -scheme LaneIOSPrototype             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"

          mkdir -p Payload Output
          cp -R "$APP_PATH" Payload/Lane.app

          # Original Lane artwork extracted from lane1.4.7.apk.
          if [ -d LaneAssets ]; then
            cp LaneAssets/*.png Payload/Lane.app/ 2>/dev/null || true
          fi

          # Generate standard iPhone icon sizes from the original Lane splash mark.
          if [ -f LaneAssets/ic_splash_logo_dark.png ]; then
            sips -z 120 120 LaneAssets/ic_splash_logo_dark.png --out Payload/Lane.app/Icon-60@2x.png >/dev/null
            sips -z 180 180 LaneAssets/ic_splash_logo_dark.png --out Payload/Lane.app/Icon-60@3x.png >/dev/null
          fi

          ditto -c -k --sequesterRsrc --keepParent Payload Output/Lane.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lane-IPA
          path: Output/Lane.ipa
          if-no-files-found: error
