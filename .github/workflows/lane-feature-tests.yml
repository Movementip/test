name: Lane feature regressions
on:
  workflow_dispatch:
jobs:
  feature-tests:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and test new native features on iPhone 13
        run: |
          set -euo pipefail
          LANE_SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME=$(xcrun simctl list runtimes -j | python3 Tools/select_simulator_runtime.py "$LANE_SIMULATOR_SDK")
          echo "Testing Xcode SDK $LANE_SIMULATOR_SDK with runtime $RUNTIME"
          UDID=$(xcrun simctl create "Lane features iPhone 13" com.apple.CoreSimulator.SimDeviceType.iPhone-13 "$RUNTIME")
          xcodebuild -project LaneIOSPrototype.xcodeproj -scheme LaneIOSPrototype -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath /tmp/lane-feature-build \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" build-for-testing
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p Output
          xcodebuild -project LaneIOSPrototype.xcodeproj -scheme LaneIOSPrototype -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath /tmp/lane-feature-build \
            -resultBundlePath Output/Lane-Features.xcresult -parallel-testing-enabled NO \
            -only-testing:LaneIOSPrototypeUITests/LaneNavigationTests/testAdaptiveDownloadIsRestoredAndPlaysWithHTTPServerStopped \
            -only-testing:LaneIOSPrototypeUITests/LaneNavigationTests/testPremiumPricingRetryAndConfirmedCancellation \
            -only-testing:LaneIOSPrototypeUITests/LaneNavigationTests/testMemorialRetryPaginationConfirmedCandleAndBack \
            -only-testing:LaneIOSPrototypeUITests/LaneNavigationTests/testImageCropCancelAndConfirmedJPEGUploadAndAnimatedGIF \
            -only-testing:LaneIOSPrototypeUITests/LaneNavigationTests/testAudioInterruptionPauseMediaResetAndHeadphoneRemoval \
            -only-testing:LaneIOSPrototypeUITests/LaneNavigationTests/testEqualizerProcessesRealAudioAndRestoresNeutralWithoutStopping \
            -only-testing:LaneIOSPrototypeUITests/LaneNavigationTests/testRangeBridgeStartsBeforeWholeFileAndOfflinePlayback \
            -only-testing:LaneIOSPrototypeUITests/LaneNavigationTests/testRealLibraryCountsTabReselectionAndBottomSafeArea \
            -only-testing:LaneIOSPrototypeUITests/LaneNavigationTests/testYandexAccountLoginFindsDelayedFavoriteAnchorWithoutManualLink \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" test-without-building
      - name: Native download diagnostics
        if: failure()
        run: |
          mkdir -p Output
          xcrun simctl spawn booted log show --last 10m --style compact --predicate 'eventMessage CONTAINS "com.lane.ios" OR process == "nsurlsessiond"' > Output/Lane-NativeDownload.log || true
      - name: Export results
        if: always()
        run: |
          if [ -d Output/Lane-Features.xcresult ]; then
            xcrun xcresulttool export attachments --path Output/Lane-Features.xcresult --output-path Output/Attachments
            xcrun xcresulttool get test-results summary --path Output/Lane-Features.xcresult > Output/Test-Summary.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lane-feature-Test-Results
          path: Output/
